---
- name: Deploy Dhanada
  hosts: production
  become: true

  tasks:
    - name: Create deployment directory
      ansible.builtin.file:
        path: /opt/dhanada
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Sync Dhanada project from local machine
      become: false
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../"
        dest: /opt/dhanada/
        delete: false
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=.DS_Store"
          - "--exclude=frontend/node_modules"
          - "--exclude=frontend/knaps/node_modules"
          - "--exclude=frontend/dist"
          - "--exclude=__pycache__"
          - "--exclude=.ruff_cache"

    - name: Build and start Docker services
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: /opt/dhanada

    - name: Fix shared Frappe assets
      ansible.builtin.command:
        cmd: >
          docker compose exec -T backend bash -c '
          cd /home/frappe/frappe-bench/assets;

          for item in *; do
            if [ -L "$item" ]; then
              target=$(readlink -f "$item");

              if [ -d "$target" ]; then
                rm "$item";
                cp -a "$target" "$item";
              fi
            fi
          done
          '
        chdir: /opt/dhanada
    - name: Recreate Frappe frontend
      ansible.builtin.command:
        cmd: docker compose up -d --force-recreate frappe-frontend
        chdir: /opt/dhanada

    - name: Show running containers
      ansible.builtin.command:
        cmd: docker compose ps
        chdir: /opt/dhanada
      register: docker_status

    - name: Display Docker status
      ansible.builtin.debug:
        var: docker_status.stdout_lines

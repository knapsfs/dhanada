name: Build image

# Build on push to feat/deploy_test (or manual dispatch) and push an immutable
# commit-tagged image to Docker Hub (knapsdocker/dhanada:sha-<full_sha>).
# Never automatically deploys and never uses :latest.

on:
  push:
    branches:
      - feat/deploy_test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Determine target commit
        id: meta
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TARGET_SHA="$EVENT_SHA"
          if [ -z "$TARGET_SHA" ]; then
            echo "::error::Could not determine target commit SHA."
            exit 1
          fi
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Building image for commit $TARGET_SHA"

      - name: Checkout Dhanada at target commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.meta.outputs.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: docker.io/knapsdocker/dhanada:sha-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image and resolve digest
        id: verify
        env:
          TARGET_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          TAG="docker.io/knapsdocker/dhanada:sha-${TARGET_SHA}"
          DIGEST="$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' | jq -r '.digest // empty' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve sha256 digest for $TAG (got '$DIGEST')"
            exit 1
          fi
          IMAGE_BY_DIGEST="docker.io/knapsdocker/dhanada@${DIGEST}"
          docker pull "$IMAGE_BY_DIGEST"
          docker run --rm --entrypoint "" "$IMAGE_BY_DIGEST" python3 - <<'PY'
          import json, os, sys
          knaps_index = "/home/frappe/frappe-bench/apps/dhanada/public/knaps/index.html"
          assets_manifest = "/home/frappe/frappe-bench/sites/assets/assets.json"
          for p in (knaps_index, assets_manifest):
              if not (os.path.isfile(p) and os.path.getsize(p) > 0):
                  print(f"::error::Missing or empty required file in image: {p}")
                  sys.exit(1)
          with open(assets_manifest) as f:
              data = json.load(f)
          if not data:
              print("::error::assets.json is empty")
              sys.exit(1)
          print(f"Verified {knaps_index} and {assets_manifest} ({len(data)} entries).")
          PY
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Docker Hub image built"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ steps.meta.outputs.sha }}\` |"
            echo "| Image | \`${{ steps.verify.outputs.tag }}\` |"
            echo "| Digest | \`${{ steps.verify.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

name: Build image

# Build on push to feat/deploy_test (or manual dispatch), push an immutable
# commit-tagged image to Docker Hub (docker.io/knapsdocker/dhanada:sha-<full_sha>),
# optionally alias a validated Git release version (knapsdocker/dhanada:<version>)
# to the exact same digest without overwriting existing releases, verify built
# assets by digest, and automatically dispatch development deployment for
# feat/deploy_test to Satyam4755/deployment-test. Never uses :latest and never
# triggers deployment for develop, production, or unrelated branches.

on:
  push:
    branches:
      - feat/deploy_test
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional semantic version tag (e.g. 1.17.0; defaults to vX.Y.Z Git tag on commit if present)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Determine target commit
        id: meta
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TARGET_SHA="$EVENT_SHA"
          if [ -z "$TARGET_SHA" ]; then
            echo "::error::Could not determine target commit SHA."
            exit 1
          fi
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Building image for commit $TARGET_SHA"

      - name: Checkout Dhanada at target commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.meta.outputs.sha }}
          fetch-depth: 0

      - name: Resolve semantic version from repository tags
        id: semver
        env:
          TARGET_SHA: ${{ steps.meta.outputs.sha }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin || true

          VERSION=""
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
            if [ "$VERSION" = "latest" ] || [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid semantic version '$INPUT_VERSION'. Must be X.Y.Z (never 'latest')."
              exit 1
            fi
            if TAG_SHA="$(git rev-parse --verify --quiet "refs/tags/v${VERSION}^{commit}")"; then
              if [ "$TAG_SHA" != "$TARGET_SHA" ]; then
                echo "::error::Version conflict: Git tag v${VERSION} points to $TAG_SHA, not $TARGET_SHA."
                exit 1
              fi
            fi
          else
            GIT_TAG="$(git tag --points-at "$TARGET_SHA" --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' | head -1 || true)"
            if [ -n "$GIT_TAG" ]; then
              VERSION="${GIT_TAG#v}"
            fi
          fi

          if [ -n "$VERSION" ]; then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Resolved semantic version tag: docker.io/knapsdocker/dhanada:${VERSION}"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "No vX.Y.Z Git tag points at $TARGET_SHA; skipping semantic version tag and publishing sha-$TARGET_SHA only."
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check for existing Docker Hub version conflict
        if: steps.semver.outputs.version != ''
        env:
          TARGET_SHA: ${{ steps.meta.outputs.sha }}
          VERSION: ${{ steps.semver.outputs.version }}
        run: |
          set -euo pipefail
          VERSION_TAG="docker.io/knapsdocker/dhanada:${VERSION}"
          SHA_TAG="docker.io/knapsdocker/dhanada:sha-${TARGET_SHA}"
          if V_MANIFEST="$(docker buildx imagetools inspect "$VERSION_TAG" --format '{{json .Manifest}}' 2>/dev/null)"; then
            V_DIGEST="$(printf '%s\n' "$V_MANIFEST" | jq -r '.digest // empty' | tr '[:upper:]' '[:lower:]')"
            if S_MANIFEST="$(docker buildx imagetools inspect "$SHA_TAG" --format '{{json .Manifest}}' 2>/dev/null)"; then
              S_DIGEST="$(printf '%s\n' "$S_MANIFEST" | jq -r '.digest // empty' | tr '[:upper:]' '[:lower:]')"
              if [ "$V_DIGEST" = "$S_DIGEST" ] && [ -n "$V_DIGEST" ]; then
                echo "$VERSION_TAG already points to the same digest as $SHA_TAG ($V_DIGEST)."
                exit 0
              fi
            fi
            echo "::error::Version conflict: $VERSION_TAG already exists on Docker Hub (digest $V_DIGEST) and does not belong to $SHA_TAG. Refusing to overwrite an existing release tag."
            exit 1
          fi
          echo "No existing Docker Hub image at $VERSION_TAG; safe to publish after build."

      - name: Build and push to Docker Hub
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: docker.io/knapsdocker/dhanada:sha-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image and resolve digest
        id: verify
        env:
          TARGET_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          TAG="docker.io/knapsdocker/dhanada:sha-${TARGET_SHA}"
          DIGEST="$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' | jq -r '.digest // empty' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve sha256 digest for $TAG (got '$DIGEST')"
            exit 1
          fi
          IMAGE_BY_DIGEST="docker.io/knapsdocker/dhanada@${DIGEST}"
          docker pull "$IMAGE_BY_DIGEST"
          docker run --rm --entrypoint "" "$IMAGE_BY_DIGEST" python3 - <<'PY'
          import json, os, sys
          knaps_index = "/home/frappe/frappe-bench/apps/dhanada/public/knaps/index.html"
          assets_manifest = "/home/frappe/frappe-bench/sites/assets/assets.json"
          for p in (knaps_index, assets_manifest):
              if not (os.path.isfile(p) and os.path.getsize(p) > 0):
                  print(f"::error::Missing or empty required file in image: {p}")
                  sys.exit(1)
          with open(assets_manifest) as f:
              data = json.load(f)
          if not data:
              print("::error::assets.json is empty")
              sys.exit(1)
          print(f"Verified {knaps_index} and {assets_manifest} ({len(data)} entries).")
          PY
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Publish semantic version tag to same digest
        id: publish_version
        if: steps.semver.outputs.version != ''
        env:
          VERSION: ${{ steps.semver.outputs.version }}
          DIGEST: ${{ steps.verify.outputs.digest }}
        run: |
          set -euo pipefail
          VERSION_TAG="docker.io/knapsdocker/dhanada:${VERSION}"
          if V_MANIFEST="$(docker buildx imagetools inspect "$VERSION_TAG" --format '{{json .Manifest}}' 2>/dev/null)"; then
            V_DIGEST="$(printf '%s\n' "$V_MANIFEST" | jq -r '.digest // empty' | tr '[:upper:]' '[:lower:]')"
            if [ "$V_DIGEST" != "$DIGEST" ]; then
              echo "::error::Version conflict: $VERSION_TAG already exists on Docker Hub with digest $V_DIGEST (expected $DIGEST). Refusing to overwrite."
              exit 1
            fi
            echo "Verified $VERSION_TAG already points to $DIGEST."
          else
            docker buildx imagetools create -t "$VERSION_TAG" "docker.io/knapsdocker/dhanada@${DIGEST}"
            CREATED_DIGEST="$(docker buildx imagetools inspect "$VERSION_TAG" --format '{{json .Manifest}}' | jq -r '.digest // empty' | tr '[:upper:]' '[:lower:]')"
            if [ "$CREATED_DIGEST" != "$DIGEST" ]; then
              echo "::error::Digest mismatch after aliasing $VERSION_TAG: got '$CREATED_DIGEST', expected '$DIGEST'."
              exit 1
            fi
            echo "Published $VERSION_TAG -> $CREATED_DIGEST."
          fi
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"

      - name: Dispatch development deploy to Satyam4755/deployment-test
        id: dispatch
        if: success() && github.ref == 'refs/heads/feat/deploy_test'
        env:
          GH_TOKEN: ${{ secrets.DEPLOYMENT_REPO_DISPATCH_TOKEN }}
          TARGET_SHA: ${{ steps.meta.outputs.sha }}
          DIGEST: ${{ steps.verify.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::DEPLOYMENT_REPO_DISPATCH_TOKEN is not set. Cannot dispatch development deployment to Satyam4755/deployment-test."
            exit 1
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid or missing image digest '$DIGEST'. Refusing to dispatch deployment."
            exit 1
          fi
          echo "Dispatching development deployment to Satyam4755/deployment-test (sha=$TARGET_SHA, digest=$DIGEST)..."
          if ! RESPONSE="$(gh api --method POST repos/Satyam4755/deployment-test/dispatches \
            -f event_type=deploy \
            -F "client_payload[digest]=$DIGEST" \
            -F "client_payload[sha]=$TARGET_SHA" \
            -F "client_payload[environment]=development" \
            -F "client_payload[actor]=$GITHUB_ACTOR" 2>&1)"; then
            echo "::error::Failed to dispatch development deployment to Satyam4755/deployment-test for commit $TARGET_SHA (digest $DIGEST): $RESPONSE"
            if printf '%s' "$RESPONSE" | grep -q '403'; then
              echo "::error::Check that secret DEPLOYMENT_REPO_DISPATCH_TOKEN grants access to Satyam4755/deployment-test with Contents: Read and write."
            fi
            exit 1
          fi
          echo "Dispatched event_type=deploy (environment=development, sha=$TARGET_SHA, digest=$DIGEST) to Satyam4755/deployment-test."

      - name: Summary
        if: steps.verify.outcome == 'success'
        run: |
          {
            echo "### Docker Hub image built"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ steps.meta.outputs.sha }}\` |"
            echo "| SHA image tag | \`${{ steps.verify.outputs.tag }}\` |"
            echo "| Version image tag | \`${{ steps.publish_version.outputs.version_tag || 'none (no release tag on commit)' }}\` |"
            echo "| Digest | \`${{ steps.verify.outputs.digest }}\` |"
            echo "| Environment | \`development\` |"
            echo "| Target domain | \`local-prod.knaps.app\` |"
            echo "| Dispatch status | \`${{ steps.dispatch.outcome }}\` |"
            echo "| Deployment | [deploy-app.yml](https://github.com/Satyam4755/deployment-test/actions/workflows/deploy-app.yml) |"
          } >> "$GITHUB_STEP_SUMMARY"

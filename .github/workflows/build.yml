name: Build image

# Build once, on merge to develop. The image is the artifact that moves
# between environments; it is never rebuilt for production.
#
# This runs after CI completes successfully on develop, so a red merge never
# produces an image.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: build-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout the commit CI tested
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve the base image
        run: |
          set -euo pipefail
          BASE="${{ vars.ERPNEXT_IMAGE }}"
          if [ -z "$BASE" ]; then
            BASE="frappe/erpnext:develop"
            echo "::warning::ERPNEXT_IMAGE is not set; using $BASE. Pin a version or digest in repository variables."
          fi
          echo "ERPNEXT_IMAGE=$BASE" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_COMMIT=${{ github.event.workflow_run.head_sha }}
            ERPNEXT_IMAGE=${{ env.ERPNEXT_IMAGE }}
          # sha-<full> is the durable, immutable handle. `develop` is a
          # convenience alias for humans; deploys never use it.
          tags: |
            ghcr.io/knapsfs/dhanada:sha-${{ github.event.workflow_run.head_sha }}
            ghcr.io/knapsfs/dhanada:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/knapsfs/dhanada
          subject-digest: ${{ steps.push.outputs.digest }}
          push: true

      - name: Summary
        run: |
          {
            echo "### Image built"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | \`${{ github.event.workflow_run.head_sha }}\` |"
            echo "| Digest | \`${{ steps.push.outputs.digest }}\` |"
            echo "| Base image | \`${{ env.ERPNEXT_IMAGE }}\` |"
            echo ""
            echo "Deploy this digest to development, then promote the same digest."
          } >> "$GITHUB_STEP_SUMMARY"

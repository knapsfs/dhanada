name: Build image

# Build once, on merge to develop. The image is the artifact that moves
# between environments; it is never rebuilt for production.
#
# This runs after CI completes successfully on develop, so a red merge never
# produces an image.
#
# Uses frappe_docker's layered Containerfile (frappe/build + frappe/base,
# version-16). The dhanada app is installed at build time via a secret-mounted
# apps.json, following the same pattern as frappe/crm.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: build-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Set branch
        run: |
          echo "FRAPPE_BRANCH=version-16" >> $GITHUB_ENV

      - name: Checkout frappe_docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: builds

      - name: Write apps.json into build context
        run: |
          cat > builds/apps.json << 'EOF'
[{"url": "https://github.com/knapsfs/dhanada", "branch": "develop"}]
EOF

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: builds
          file: builds/images/layered/Containerfile
          push: true
          build-args: |
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
          secrets: |
            "apps_json=apps.json"
          tags: |
            ghcr.io/knapsfs/dhanada:sha-${{ github.event.workflow_run.head_sha }}
            ghcr.io/knapsfs/dhanada:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/knapsfs/dhanada
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Image built"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | \`${{ github.event.workflow_run.head_sha }}\` |"
            echo "| Digest | \`${{ steps.push.outputs.digest }}\` |"
            echo "| Base image | frappe/build:version-16 + frappe/base:version-16 |"
            echo ""
            echo "Deploy this digest to development, then promote the same digest."
          } >> "$GITHUB_STEP_SUMMARY"

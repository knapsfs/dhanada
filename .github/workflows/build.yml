name: Build and Deploy Dhanada

on:
  workflow_dispatch:
  push:
    branches:
      - feat/sif_scheme

permissions:
  contents: write

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Dhanada
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "(MINOR)"
          version_format: "${major}.${minor}.${patch}"
          change_path: "."

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Dhanada
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: knapsdocker/dhanada:${{ steps.version.outputs.version }}
          no-cache: true
          
      - name: Verify KNAPS assets
        run: |
          docker pull knapsdocker/dhanada:${{ steps.version.outputs.version }}
          docker run --rm knapsdocker/dhanada:${{ steps.version.outputs.version }} \
            find /home/frappe/frappe-bench/apps/dhanada/public/knaps -maxdepth 3 -type f
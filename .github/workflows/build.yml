name: Build image

# Build on push to feat/deploy_test (or manual dispatch), push an immutable
# commit-tagged image to Docker Hub (docker.io/knapsdocker/dhanada:sha-<full_sha>),
# verify built assets by digest, and automatically dispatch development deployment
# for feat/deploy_test to Satyam4755/deployment-test. Never uses :latest and
# never triggers deployment for develop, production, or unrelated branches.

on:
  push:
    branches:
      - feat/deploy_test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Determine target commit
        id: meta
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TARGET_SHA="$EVENT_SHA"
          if [ -z "$TARGET_SHA" ]; then
            echo "::error::Could not determine target commit SHA."
            exit 1
          fi
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Building image for commit $TARGET_SHA"

      - name: Checkout Dhanada at target commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.meta.outputs.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: docker.io/knapsdocker/dhanada:sha-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image and resolve digest
        id: verify
        env:
          TARGET_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          TAG="docker.io/knapsdocker/dhanada:sha-${TARGET_SHA}"
          DIGEST="$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' | jq -r '.digest // empty' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve sha256 digest for $TAG (got '$DIGEST')"
            exit 1
          fi
          IMAGE_BY_DIGEST="docker.io/knapsdocker/dhanada@${DIGEST}"
          docker pull "$IMAGE_BY_DIGEST"
          docker run --rm --entrypoint "" "$IMAGE_BY_DIGEST" python3 - <<'PY'
          import json, os, sys
          knaps_index = "/home/frappe/frappe-bench/apps/dhanada/public/knaps/index.html"
          assets_manifest = "/home/frappe/frappe-bench/sites/assets/assets.json"
          for p in (knaps_index, assets_manifest):
              if not (os.path.isfile(p) and os.path.getsize(p) > 0):
                  print(f"::error::Missing or empty required file in image: {p}")
                  sys.exit(1)
          with open(assets_manifest) as f:
              data = json.load(f)
          if not data:
              print("::error::assets.json is empty")
              sys.exit(1)
          print(f"Verified {knaps_index} and {assets_manifest} ({len(data)} entries).")
          PY
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Dispatch development deploy to Satyam4755/deployment-test
        id: dispatch
        if: success() && github.ref == 'refs/heads/feat/deploy_test'
        env:
          GH_TOKEN: ${{ secrets.DEPLOYMENT_REPO_DISPATCH_TOKEN }}
          TARGET_SHA: ${{ steps.meta.outputs.sha }}
          DIGEST: ${{ steps.verify.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::DEPLOYMENT_REPO_DISPATCH_TOKEN is not set. Cannot dispatch development deployment to Satyam4755/deployment-test."
            exit 1
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid or missing image digest '$DIGEST'. Refusing to dispatch deployment."
            exit 1
          fi
          echo "Dispatching development deployment to Satyam4755/deployment-test (sha=$TARGET_SHA, digest=$DIGEST)..."
          if ! RESPONSE="$(gh api --method POST repos/Satyam4755/deployment-test/dispatches \
            -f event_type=deploy \
            -F "client_payload[digest]=$DIGEST" \
            -F "client_payload[sha]=$TARGET_SHA" \
            -F "client_payload[environment]=development" \
            -F "client_payload[actor]=$GITHUB_ACTOR" 2>&1)"; then
            echo "::error::Failed to dispatch development deployment to Satyam4755/deployment-test for commit $TARGET_SHA (digest $DIGEST): $RESPONSE"
            exit 1
          fi
          echo "Dispatched event_type=deploy (environment=development, sha=$TARGET_SHA, digest=$DIGEST) to Satyam4755/deployment-test."

      - name: Summary
        if: steps.verify.outcome == 'success'
        run: |
          {
            echo "### Docker Hub image built"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ steps.meta.outputs.sha }}\` |"
            echo "| Image | \`${{ steps.verify.outputs.tag }}\` |"
            echo "| Digest | \`${{ steps.verify.outputs.digest }}\` |"
            echo "| Environment | \`development\` |"
            echo "| Target domain | \`local-prod.knaps.app\` |"
            echo "| Dispatch status | \`${{ steps.dispatch.outcome }}\` |"
            echo "| Deployment | [deploy-app.yml](https://github.com/Satyam4755/deployment-test/actions/workflows/deploy-app.yml) |"
          } >> "$GITHUB_STEP_SUMMARY"

name: Release

# Turn an already-built, already-validated commit into a release:
#   - tag the exact commit that produced the image (no rebuild);
#   - add a human-readable version tag to the same image digest;
#   - open the develop -> main bookkeeping PR.
#
# The image is not rebuilt here. `v1.10.0` points at the same digest that
# development already deployed.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version without the leading v, e.g. 1.10.0'
        required: true
        type: string
      sha:
        description: 'Validated commit on develop (empty = current develop head)'
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Resolve and validate the commit
        id: ref
        env:
          INPUT_SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          SHA="$INPUT_SHA"
          if [ -z "$SHA" ]; then
            SHA="$(git rev-parse origin/develop)"
          fi
          if ! git merge-base --is-ancestor "$SHA" origin/develop; then
            echo "::error::$SHA is not on develop."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version '$VERSION' is not a semantic version (e.g. 1.10.0)."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION already exists."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the built digest
        id: image
        env:
          SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -euo pipefail
          TAG="ghcr.io/knapsfs/dhanada:sha-$SHA"
          if ! docker buildx imagetools inspect "$TAG" >/dev/null 2>&1; then
            echo "::error::No image for $TAG. The release must point at a built image."
            exit 1
          fi
          DIGEST="$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' | jq -r .digest)"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve a digest for $TAG"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Create the release tag on the built commit
        env:
          SHA: ${{ steps.ref.outputs.sha }}
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" "$SHA" -m "Release v$VERSION (digest ${{ steps.image.outputs.digest }})"
          git push origin "refs/tags/v$VERSION"

      - name: Add the version alias to the same digest (no rebuild)
        env:
          VERSION: ${{ steps.ref.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "ghcr.io/knapsfs/dhanada:$VERSION" \
            "ghcr.io/knapsfs/dhanada@$DIGEST"

      - name: Summary
        env:
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          {
            echo "### Release v${{ steps.ref.outputs.version }}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | \`${{ steps.ref.outputs.sha }}\` |"
            echo "| Digest | \`${{ steps.image.outputs.digest }}\` |"
            echo "| Image tag | \`${{ steps.ref.outputs.version }}\` |"
            echo ""
            echo "Next:"
            echo ""
            echo "1. Run **Promote to production** with the digest above."
            echo "2. After production succeeds, open the \`develop → main\` PR."
            echo ""
            echo "The PR is opened by a person on purpose: a pull request created by"
            echo "\`GITHUB_TOKEN\` does not trigger the required checks."
          } >> "$GITHUB_STEP_SUMMARY"

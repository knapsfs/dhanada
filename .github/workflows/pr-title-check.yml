name: PR Title Check

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title
            // Enforce: type(scope): description #issue
            // Example: feat(auth): add user profile #42
            if (!/^(feat|fix|docs|style|refactor|perf|test|chore|ci)\(.+\): .+ #\d+$/.test(title)) {
              core.setFailed(
                'Invalid PR title format.\n' +
                'Expected: type(scope): description #issue\n' +
                'Correct:   feat(auth): add user profile #42\n' +
                'Incorrect: feat(auth): add user profile\n' +
                'Incorrect: feat(auth): add user profile #abc\n' +
                'Got:       ' + title
              )
            }

name: Deploy development

# Manual deployment of a feat/deploy_test commit to local-prod.knaps.app via
# Satyam4755/deployment-test. Builds and pushes knapsdocker/dhanada:sha-<sha>
# from the exact commit if not already present on Docker Hub (or if rebuild is
# requested), resolves its immutable sha256 digest, and dispatches the digest.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit on feat/deploy_test (leave empty for current feat/deploy_test head)'
        required: false
        type: string
      rebuild:
        description: 'Force rebuild even if knapsdocker/dhanada:sha-<sha> already exists'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-development
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout feat/deploy_test
        uses: actions/checkout@v6
        with:
          ref: feat/deploy_test
          fetch-depth: 0

      - name: Resolve and checkout exact commit
        id: ref
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          SHA="$INPUT_SHA"
          if [ -z "$SHA" ]; then
            SHA="origin/feat/deploy_test"
          fi
          if ! SHA="$(git rev-parse --verify --quiet "${SHA}^{commit}")"; then
            echo "::error::'${INPUT_SHA}' is not a commit in this repository."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" origin/feat/deploy_test; then
            echo "::error::$SHA is not on feat/deploy_test. Only feat/deploy_test commits are deployable."
            exit 1
          fi
          git checkout --detach "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Selected commit $SHA"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check for existing Docker Hub image
        id: check
        env:
          SHA: ${{ steps.ref.outputs.sha }}
          FORCE_REBUILD: ${{ inputs.rebuild }}
        run: |
          set -euo pipefail
          TAG="docker.io/knapsdocker/dhanada:sha-${SHA}"
          if [ "$FORCE_REBUILD" = "true" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Force rebuild requested for $TAG"
          elif docker buildx imagetools inspect "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Found existing image $TAG"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No existing image for $TAG; will build and push from $SHA"
          fi

      - name: Build and push Docker Hub image
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: docker.io/knapsdocker/dhanada:sha-${{ steps.ref.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve the Docker Hub image digest
        id: image
        env:
          SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -euo pipefail
          TAG="docker.io/knapsdocker/dhanada:sha-${SHA}"
          DIGEST="$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' | jq -r '.digest // empty' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve a digest for $TAG (got '$DIGEST')"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG -> $DIGEST"

      - name: Dispatch the digest to Satyam4755/deployment-test
        env:
          GH_TOKEN: ${{ secrets.DEPLOYMENT_REPO_DISPATCH_TOKEN }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::DEPLOYMENT_REPO_DISPATCH_TOKEN is not set."
            exit 1
          fi
          gh api --method POST repos/Satyam4755/deployment-test/dispatches \
            -f event_type=deploy \
            -F "client_payload[digest]=$DIGEST" \
            -F "client_payload[environment]=development" \
            -F "client_payload[actor]=$GITHUB_ACTOR"

      - name: Summary
        run: |
          {
            echo "### Development deploy requested"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Branch | \`feat/deploy_test\` |"
            echo "| Commit | \`${{ steps.ref.outputs.sha }}\` |"
            echo "| Target environment | \`development\` |"
            echo "| Target domain | \`local-prod.knaps.app\` |"
            echo "| Image | \`${{ steps.image.outputs.tag }}\` |"
            echo "| Digest | \`${{ steps.image.outputs.digest }}\` |"
            echo "| Deployment | [deploy-app.yml](https://github.com/Satyam4755/deployment-test/actions/workflows/deploy-app.yml) |"
          } >> "$GITHUB_STEP_SUMMARY"

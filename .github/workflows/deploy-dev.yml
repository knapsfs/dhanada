name: Deploy development

# Manual deployment of a feat/deploy_test commit to local-prod.knaps.app via
# Satyam4755/deployment-test. Requires knapsdocker/dhanada:sha-<sha> to already
# be built and pushed by the Build image workflow, resolves its immutable sha256
# digest from Docker Hub, and dispatches the digest.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit on feat/deploy_test (leave empty for current feat/deploy_test head)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-development
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feat/deploy_test
        uses: actions/checkout@v6
        with:
          ref: feat/deploy_test
          fetch-depth: 0

      - name: Resolve and validate feat/deploy_test commit
        id: ref
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          SHA="$INPUT_SHA"
          if [ -z "$SHA" ]; then
            SHA="origin/feat/deploy_test"
          fi
          if ! SHA="$(git rev-parse --verify --quiet "${SHA}^{commit}")"; then
            echo "::error::'${INPUT_SHA}' is not a commit in this repository."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" origin/feat/deploy_test; then
            echo "::error::$SHA is not on feat/deploy_test. Only feat/deploy_test commits are deployable."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Selected commit $SHA"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Locate Docker Hub image and resolve digest
        id: image
        env:
          SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -euo pipefail
          TAG="docker.io/knapsdocker/dhanada:sha-${SHA}"
          if ! MANIFEST="$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' 2>/dev/null)"; then
            echo "::error::Image $TAG is not available on Docker Hub. Wait for the 'Build image' workflow to finish for commit $SHA before running Deploy development."
            exit 1
          fi
          DIGEST="$(printf '%s\n' "$MANIFEST" | jq -r '.digest // empty' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve an immutable sha256 digest for $TAG (got '$DIGEST'). Wait for the 'Build image' workflow to finish."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG -> $DIGEST"

      - name: Dispatch the digest to Satyam4755/deployment-test
        env:
          GH_TOKEN: ${{ secrets.DEPLOYMENT_REPO_DISPATCH_TOKEN }}
          SHA: ${{ steps.ref.outputs.sha }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::DEPLOYMENT_REPO_DISPATCH_TOKEN is not set."
            exit 1
          fi
          gh api --method POST repos/Satyam4755/deployment-test/dispatches \
            -f event_type=deploy \
            -F "client_payload[digest]=$DIGEST" \
            -F "client_payload[sha]=$SHA" \
            -F "client_payload[environment]=development" \
            -F "client_payload[actor]=$GITHUB_ACTOR"

      - name: Summary
        run: |
          {
            echo "### Development deploy requested"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Branch | \`feat/deploy_test\` |"
            echo "| Commit | \`${{ steps.ref.outputs.sha }}\` |"
            echo "| Image | \`${{ steps.image.outputs.tag }}\` |"
            echo "| Digest | \`${{ steps.image.outputs.digest }}\` |"
            echo "| Environment | \`development\` |"
            echo "| Target domain | \`local-prod.knaps.app\` |"
            echo "| Deployment | [deploy-app.yml](https://github.com/Satyam4755/deployment-test/actions/workflows/deploy-app.yml) |"
          } >> "$GITHUB_STEP_SUMMARY"

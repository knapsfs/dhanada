name: Deploy development

# Manual promotion of an already-built image to the shared development host.
# The image was built once by the Build image workflow; this job only resolves
# its digest and asks the deployment repository to deploy it.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit on develop (leave empty for the current develop head)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-development
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Resolve the commit
        id: ref
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          SHA="$INPUT_SHA"
          if [ -z "$SHA" ]; then
            SHA="origin/develop"
          fi
          # Accept a short SHA or a ref, but always emit the full commit id:
          # the image tag is sha-<full sha>.
          if ! SHA="$(git rev-parse --verify --quiet "${SHA}^{commit}")"; then
            echo "::error::'${INPUT_SHA}' is not a commit in this repository."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" origin/develop; then
            echo "::error::$SHA is not on develop. Only develop commits are deployable."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying commit $SHA"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve the image digest
        id: image
        env:
          SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -euo pipefail
          TAG="knapsdocker/dhanada:sha-$SHA"
          if ! docker buildx imagetools inspect "$TAG" >/dev/null 2>&1; then
            echo "::error::No image for $TAG."
            echo "::error::Wait for the Build image workflow, or choose a commit that has one."
            exit 1
          fi
          DIGEST="$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' | jq -r .digest)"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve a digest for $TAG (got '$DIGEST')"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG -> $DIGEST"

      - name: Check deployment repository access
        env:
          GH_TOKEN: ${{ secrets.DEPLOYMENT_REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::DEPLOYMENT_REPO_DISPATCH_TOKEN is not set."
            exit 1
          fi
          if ! gh api repos/knapsfs/deployment >/dev/null 2>&1; then
            echo "::error::The dispatch token cannot access the deployment repository (knapsfs/deployment)."
            echo "::error::Fix: add knapsfs/deployment to the token's Repository access and grant Actions: write. The repository must exist in the knapsfs organization."
            exit 1
          fi

      - name: Request the development deployment
        env:
          GH_TOKEN: ${{ secrets.DEPLOYMENT_REPO_DISPATCH_TOKEN }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::DEPLOYMENT_REPO_DISPATCH_TOKEN is not set."
            exit 1
          fi
          gh workflow run deploy-app.yml -R knapsfs/deployment \
            -f digest="$DIGEST" \
            -f environment=development \
            -f actor="$GITHUB_ACTOR"

      - name: Summary
        run: |
          {
            echo "### Development deploy requested"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | \`${{ steps.ref.outputs.sha }}\` |"
            echo "| Digest | \`${{ steps.image.outputs.digest }}\` |"
            echo "| Deployment | [deploy-app.yml](https://github.com/knapsfs/deployment/actions/workflows/deploy-app.yml) |"
          } >> "$GITHUB_STEP_SUMMARY"
